name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  id-token: write   # needed for AWS OIDC login
  contents: write   # needed to commit the new image tag back to the repo

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: devops-demo-app

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven verify (compile + unit tests)
        working-directory: app
        run: mvn -B verify

  docker:
    name: Image build, scan and push
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $ECR_REPOSITORY:${{ github.sha }} app

      - name: Trivy vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            $ECR_REPOSITORY:${{ github.sha }}

      # Everything below runs only on pushes to main, not on pull requests
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
          docker tag $ECR_REPOSITORY:${{ github.sha }} $IMAGE
          docker push $IMAGE

      # GitOps hand-off: write the new tag into the Helm values file.
      # ArgoCD (Step 4) watches that file and deploys the change.
      - name: Update image tag in Helm values
        if: github.event_name == 'push'
        run: |
          VALUES=k8s/helm/devops-demo/values.yaml
          if [ -f "$VALUES" ]; then
            sed -i "s|^\(\s*tag:\).*|\1 \"${{ github.sha }}\"|" "$VALUES"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$VALUES"
            git diff --cached --quiet || git commit -m "ci: deploy image ${{ github.sha }} [skip ci]"
            git push
          else
            echo "No Helm values file yet (added in Step 4); skipping."
          fi
