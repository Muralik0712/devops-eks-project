# Helm values for the kube-prometheus-stack chart (Prometheus, Alertmanager, Grafana,
# kube-state-metrics, node-exporter). Sized small for a demo cluster.

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and PrometheusRules from any namespace, not only ones
    # labelled with this Helm release (so the app chart's monitoring objects are found)
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 3d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

grafana:
  service:
    type: ClusterIP   # reach it with kubectl port-forward (see README)
  # Auto-load dashboards from any ConfigMap labelled grafana_dashboard=1
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  # Admin password is generated by the chart; read it from the Kubernetes secret

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
