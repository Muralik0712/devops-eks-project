replicaCount: 2

image:
  # Replace <ACCOUNT_ID> with your AWS account ID (see `ecr_repository_url` Terraform output)
  repository: <ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/devops-demo-app
  # The CI pipeline rewrites this line with the git SHA on every push to main
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  # LoadBalancer gives a public URL without extra controllers; use ClusterIP + Ingress later if preferred
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Creates a ServiceMonitor, alert rules and a Grafana dashboard.
# Set to true only AFTER kube-prometheus-stack is installed (it provides the CRDs).
monitoring:
  enabled: false

# Needs metrics-server installed in the cluster (not included in EKS by default)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
